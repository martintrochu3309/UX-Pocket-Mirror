<!doctype html>
<html><head><meta charset="utf-8">
<!-- The link preview image (assets/images/share-v2.jpg). To redraw it: open this page at 1200x630 and save a screenshot,
     e.g. msedge --headless --window-size=1200,630 --screenshot=share.png tools/share-image.html, then save it as a NEW file name
     (share-v3.jpg…) and update og:image in index.html, so apps don't keep showing the old one. -->
<style>
@font-face { font-family: "Magistral"; src: url("../assets/fonts/magistral-bold-italic.woff2") format("woff2"); font-weight: 700; font-style: italic; }
@font-face { font-family: "Neue Haas Display"; src: url("../assets/fonts/nhd-medium.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Neue Haas Display"; src: url("../assets/fonts/nhd-bold.woff2") format("woff2"); font-weight: 700; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0a; color: #f2f2ef; }
.photo { position: absolute; right: 0; top: 0; width: 640px; height: 630px; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; filter: grayscale(.15); }
.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0a0a0a 0%, rgba(10,10,10,.85) 22%, rgba(10,10,10,0) 60%), linear-gradient(0deg, #0a0a0a 0%, rgba(10,10,10,0) 30%); }
.copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
.wm { font: italic 700 18px/1.5 "Magistral"; letter-spacing: .3em; color: #a8a8a4; }
h1 { margin-top: 28px; font: italic 700 84px/1 "Magistral"; letter-spacing: -.01em; }
h1 span { color: #e0b84c; }
.host { display: flex; align-items: center; gap: 16px; margin-top: 40px; }
.host img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px #e0b84c; }
.host b { display: block; font: 700 18px/1 "Neue Haas Display"; letter-spacing: .2em; }
.host small { display: block; margin-top: 8px; font: 500 18px/1 "Neue Haas Display"; color: #a8a8a4; }
</style></head>
<body>
  <div class="photo"><img src="../assets/images/kevin-mirror21.jpg" alt=""></div>
  <div class="copy">
    <p class="wm">THE POCKET MIRROR</p>
    <h1>ONE MINUTE<br>WITH <span>YOURSELF.</span></h1>
    <div class="host"><span><b>KEVIN CRAGGS</b><small>1-minute audio · free</small></span></div>
  </div>
</body></html>

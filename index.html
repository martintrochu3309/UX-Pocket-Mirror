<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Pocket Mirror · Daily Xcellence</title>
  <meta name="description" content="One minute with yourself. 12 one-minute Mirrors with Kevin Craggs, free. Collect the 21 cards and explore The Mirror podcast.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="The Pocket Mirror">
  <meta property="og:description" content="One minute with yourself. A 1-minute audio with Kevin Craggs, free.">
  <!-- link previews (iMessage, WhatsApp…) need the full address: change it here if the site address changes -->
  <meta property="og:url" content="https://thepocketmirror.netlify.app/">
  <!-- new preview image = new file name, so apps fetch it instead of showing the one they remember -->
  <meta property="og:image" content="https://thepocketmirror.netlify.app/assets/images/share-v2.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- ?v=2: the Daily Xcellence icon; bump it when the icon changes so phones don't keep the old one -->
  <link rel="icon" href="assets/images/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="assets/images/icon-180.png?v=2">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <meta name="apple-mobile-web-app-title" content="Pocket Mirror">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preload" href="assets/fonts/magistral-bold-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nhd-medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- The app renders into #app (see js/app.js). -->
  <main id="app" aria-live="polite"></main>

  <!-- Unlock toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Netlify Forms: this hidden form lets Netlify detect the "pocket-mirror" form at deploy time.
       The app submits to it with JavaScript. Keep the field names in sync with js/app.js. -->
  <form name="pocket-mirror" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="pocket-mirror">
    <input name="bot-field">
    <input type="email" name="email">
    <input name="mirror">
    <input name="path">
    <input name="source">
    <input name="page">
  </form>

  <noscript><p style="padding:24px;color:#fff">The Pocket Mirror needs JavaScript turned on.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/caption-timing.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
